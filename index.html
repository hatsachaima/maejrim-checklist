<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist คุณลุง</title>

<style>
body{
    font-family:sans-serif;
    background:#f5f0eb;
    padding:20px;
    color:#2c2520;
}

.app{
    max-width:480px;
    margin:auto;
}

h2{
    margin-bottom:15px;
}

.section{
    background:#fff;
    padding:16px;
    border-radius:14px;
    margin-bottom:16px;
    box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

.section-title{
    font-weight:bold;
    margin-bottom:12px;
    font-size:18px;
}

.check-btn{
    width:100%;
    padding:14px;
    margin:6px 0;
    border:none;
    border-radius:10px;
    background:#fdfaf7;
    border:1px solid #d4c4b7;
    font-size:15px;
    cursor:pointer;
}

.check-btn.done{
    background:#389e0d;
    color:white;
    font-weight:bold;
}

.form-select{
    width:100%;
    padding:12px;
    margin-top:6px;
    margin-bottom:14px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:15px;
}

.submit-btn{
    width:100%;
    padding:15px;
    background:#722ed1;
    color:white;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.reset-btn{
    width:100%;
    padding:12px;
    background:#ddd;
    border:none;
    border-radius:10px;
    margin-top:10px;
    cursor:pointer;
}

.status{
    text-align:center;
    margin-top:10px;
    font-size:14px;
    color:#666;
}
</style>
</head>

<body>

<div class="app">

<h2>📋 Checklist ดูแลคุณลุง</h2>

<div class="section">

<div class="section-title">☀️ Checklist ประจำวัน</div>

<button class="check-btn" id="task1" onclick="toggleTask('task1')">
1. ตากแดดเช้า
</button>

<button class="check-btn" id="task2" onclick="toggleTask('task2')">
2. อาบน้ำเช้า
</button>

<button class="check-btn" id="task3" onclick="toggleTask('task3')">
3. ทาครีมบำรุง
</button>

<button class="check-btn" id="task4" onclick="toggleTask('task4')">
4. กินวิตามิน
</button>

</div>

<div class="section">

<div class="section-title">📝 บันทึกอาการ</div>

<label>1. สะเก็ด / ผื่น</label>
<select id="rep_rash" class="form-select">
<option value="ดีขึ้น">ดีขึ้น</option>
<option value="เท่าเดิม">เท่าเดิม</option>
<option value="แย่ลง">แย่ลง</option>
</select>

<label>2. อาการคัน</label>
<select id="rep_itch" class="form-select">
<option value="น้อยลง">น้อยลง</option>
<option value="เท่าเดิม">เท่าเดิม</option>
<option value="มากขึ้น">มากขึ้น</option>
</select>

<label>3. แผลสด</label>
<select id="rep_wound" class="form-select">
<option value="ไม่มี">ไม่มี</option>
<option value="มี — รักษาแล้ว">มี — รักษาแล้ว</option>
<option value="มี — น่าเป็นห่วง">มี — น่าเป็นห่วง</option>
</select>

<label>4. ยาสีส้ม</label>
<select id="rep_med" class="form-select">
<option value="ให้แล้ว (ครึ่งเม็ด)">ให้แล้ว (ครึ่งเม็ด)</option>
<option value="ให้แล้ว (1 เม็ด)">ให้แล้ว (1 เม็ด)</option>
<option value="ไม่ได้ให้">ไม่ได้ให้</option>
<option value="ไม่ให้ — ลุงดื่มเหล้า">ไม่ให้ — ลุงดื่มเหล้า</option>
</select>

<button class="submit-btn" onclick="submitDailyReport()">
📤 ส่งบันทึกไปพัทลุง
</button>

<div class="status" id="statusText">
ระบบพร้อมใช้งาน
</div>

<button class="reset-btn" onclick="resetAll()">
🔄 ล้างข้อมูลวันนี้
</button>

</div>

</div>

<script>

const STORAGE_KEY = "lung_checklist_v2";

function loadState(){
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
}

function saveState(data){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function toggleTask(id){

    const state = loadState();

    state[id] = !state[id];

    saveState(state);

    updateUI();
}

function updateUI(){

    const state = loadState();

    document.querySelectorAll(".check-btn").forEach(btn=>{

        if(state[btn.id]){
            btn.classList.add("done");
            btn.innerHTML = "✓ " + btn.innerText;
        }else{
            btn.classList.remove("done");

            btn.innerHTML = btn.innerText.replace("✓ ","");
        }

    });
}

function submitDailyReport(){

    const rash = document.getElementById("rep_rash").value;
    const itch = document.getElementById("rep_itch").value;
    const wound = document.getElementById("rep_wound").value;
    const med = document.getElementById("rep_med").value;

    const status = document.getElementById("statusText");

    status.innerText = "กำลังเปิดฟอร์มส่งข้อมูล...";

    const base =
    "https://docs.google.com/forms/d/e/1FAIpQLSdx7Pn-ISb132vhlCIfx8Qy22CZmVXvBd3E2xno8SxNoHkDjg/viewform?usp=pp_url";

    const url =
    base +
    "&entry.1608891468=" + encodeURIComponent(rash) +
    "&entry.1973469220=" + encodeURIComponent(itch) +
    "&entry.1240744944=" + encodeURIComponent(wound) +
    "&entry.1043049446=" + encodeURIComponent(med);

    window.open(url, "_blank");

    status.innerText = "✓ เปิดหน้าส่งข้อมูลแล้ว";
}

function resetAll(){

    if(!confirm("ต้องการล้างข้อมูลวันนี้ใช่ไหม")){
        return;
    }

    localStorage.removeItem(STORAGE_KEY);

    updateUI();

    document.getElementById("statusText").innerText =
    "ล้างข้อมูลเรียบร้อย";
}

updateUI();

</script>

</body>
</html>
